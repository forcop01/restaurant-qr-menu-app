name: restaurant_qr_menu
description: "Flutter QR Menu App for Restaurants"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.5.0
  provider: ^6.0.0
  qr_flutter: ^4.0.0
  mobile_scanner: ^3.5.0
  image_picker: ^1.0.0
  cached_network_image: ^3.3.0
  intl: ^0.19.0
  uuid: ^4.0.0
  share_plus: ^7.2.0
  permission_handler: ^11.4.0
  google_fonts: ^6.1.0
  flutter_dotenv: ^5.1.0
  shimmer: ^3.0.0
  lottie: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
